<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Simples 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        #container {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            background: white;
            margin: 20px 0;
        }
        #info {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>🔍 Teste Simples 3D - Depuração</h1>
    
    <div id="info">
        <h3>Informações de Depuração:</h3>
        <div id="debug-info">
            <p>Carregando...</p>
        </div>
    </div>

    <div>
        <button onclick="testBasic()">Teste Básico (Cubo)</button>
        <button onclick="testTruck()">Teste Caminhão</button>
        <button onclick="testItems()">Teste Itens</button>
        <button onclick="clearScene()">Limpar Cena</button>
    </div>

    <div id="container"></div>

    <div id="log">
        <h3>Log de Eventos:</h3>
        <div id="log-content"></div>
    </div>

    <script>
        let scene, camera, renderer;
        let debugInfo = document.getElementById('debug-info');
        let logContent = document.getElementById('log-content');

        function log(message) {
            console.log(message);
            const time = new Date().toLocaleTimeString();
            logContent.innerHTML += `<div>[${time}] ${message}</div>`;
            logContent.scrollTop = logContent.scrollHeight;
        }

        function updateDebugInfo() {
            if (scene && camera && renderer) {
                debugInfo.innerHTML = `
                    <p><strong>Cena:</strong> ${scene.children.length} objetos</p>
                    <p><strong>Câmera:</strong> posição(${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)})</p>
                    <p><strong>Renderer:</strong> ${renderer.domElement.width}x${renderer.domElement.height}</p>
                    <p><strong>Three.js:</strong> ${THREE.REVISION}</p>
                `;
            }
        }

        function init() {
            log("Inicializando cena 3D...");
            
            const container = document.getElementById('container');
            
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            // Câmera
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Chão
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Grade
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);
            
            updateDebugInfo();
            render();
            log("Cena 3D inicializada com sucesso!");
        }

        function render() {
            requestAnimationFrame(render);
            renderer.render(scene, camera);
        }

        function testBasic() {
            log("Adicionando cubo de teste...");
            
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0.5, 0);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
            
            updateDebugInfo();
            log("Cubo adicionado na posição (0, 0.5, 0)");
        }

        function testTruck() {
            log("Criando caminhão de teste...");
            
            const truckGroup = new THREE.Group();
            
            // Chão do caminhão
            const floorGeometry = new THREE.BoxGeometry(4, 0.2, 2);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.position.y = 0;
            floor.castShadow = true;
            floor.receiveShadow = true;
            truckGroup.add(floor);
            
            // Paredes (linhas)
            const edges = [
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-2, 0, -1),
                    new THREE.Vector3(-2, 2, -1)
                ]),
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(2, 0, -1),
                    new THREE.Vector3(2, 2, -1)
                ]),
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-2, 0, 1),
                    new THREE.Vector3(-2, 2, 1)
                ]),
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(2, 0, 1),
                    new THREE.Vector3(2, 2, 1)
                ])
            ];
            
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x666666, linewidth: 2 });
            edges.forEach(edge => {
                const line = new THREE.Line(edge, lineMaterial);
                truckGroup.add(line);
            });
            
            truckGroup.position.set(0, 0, 0);
            scene.add(truckGroup);
            
            updateDebugInfo();
            log("Caminhão criado com dimensões 4x2x2");
        }

        function testItems() {
            log("Adicionando itens de teste...");
            
            // Item 1 - Balde
            const baldeGeometry = new THREE.BoxGeometry(0.3, 0.35, 0.3);
            const baldeMaterial = new THREE.MeshLambertMaterial({ color: 0xff6b6b });
            const balde = new THREE.Mesh(baldeGeometry, baldeMaterial);
            balde.position.set(-1, 0.175, 0);
            balde.castShadow = true;
            balde.receiveShadow = true;
            scene.add(balde);
            
            // Item 2 - Galão
            const galaoGeometry = new THREE.BoxGeometry(0.2, 0.20, 0.2);
            const galaoMaterial = new THREE.MeshLambertMaterial({ color: 0x45b7d1 });
            const galao = new THREE.Mesh(galaoGeometry, galaoMaterial);
            galao.position.set(0, 0.10, 0);
            galao.castShadow = true;
            galao.receiveShadow = true;
            scene.add(galao);
            
            // Item 3 - Container
            const containerGeometry = new THREE.BoxGeometry(1.15, 1.16, 1.15);
            const containerMaterial = new THREE.MeshLambertMaterial({ color: 0x88d8b0 });
            const container = new THREE.Mesh(containerGeometry, containerMaterial);
            container.position.set(1, 0.58, 0);
            container.castShadow = true;
            container.receiveShadow = true;
            scene.add(container);
            
            updateDebugInfo();
            log("3 itens adicionados: Balde(0.35m), Galão(0.20m), Container(1.16m)");
        }

        function clearScene() {
            log("Limpando cena...");
            
            // Remover todos os objetos exceto luzes e chão
            const objectsToRemove = [];
            scene.traverse((child) => {
                if (child.type === 'Mesh' && child.geometry instanceof THREE.BoxGeometry && child.position.y > -0.4) {
                    objectsToRemove.push(child);
                }
                if (child.type === 'Group') {
                    objectsToRemove.push(child);
                }
                if (child.type === 'Line') {
                    objectsToRemove.push(child);
                }
            });
            
            objectsToRemove.forEach(obj => {
                scene.remove(obj);
            });
            
            updateDebugInfo();
            log(`Cena limpa. ${objectsToRemove.length} objetos removidos.`);
        }

        // Inicializar ao carregar
        window.addEventListener('load', init);
        
        // Redimensionar
        window.addEventListener('resize', () => {
            const container = document.getElementById('container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            updateDebugInfo();
        });
    </script>
</body>
</html>
