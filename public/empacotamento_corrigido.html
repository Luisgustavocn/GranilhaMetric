<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empacotamento 3D Corrigido</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        #container {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            background: white;
            margin: 20px 0;
        }
        #controls {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        #info {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🚛 Empacotamento 3D Corrigido</h1>
    
    <div id="controls">
        <button onclick="testSimplePacking()">Teste Empacotamento Simples</button>
        <button onclick="testRealPacking()">Teste Carga Real</button>
        <button onclick="clearScene()">Limpar Cena</button>
        <button onclick="toggleWireframe()">Toggle Wireframe</button>
    </div>

    <div id="info">
        <h3>Informações:</h3>
        <div id="debug-info">
            <p>Carregando...</p>
        </div>
    </div>

    <div id="container"></div>

    <div id="log">
        <h3>Log de Eventos:</h3>
        <div id="log-content"></div>
    </div>

    <script>
        let scene, camera, renderer;
        let debugInfo = document.getElementById('debug-info');
        let logContent = document.getElementById('log-content');
        let wireframeMode = false;

        function log(message) {
            console.log(message);
            const time = new Date().toLocaleTimeString();
            logContent.innerHTML += `<div>[${time}] ${message}</div>`;
            logContent.scrollTop = logContent.scrollHeight;
        }

        function updateDebugInfo() {
            if (scene && camera && renderer) {
                debugInfo.innerHTML = `
                    <p><strong>Cena:</strong> ${scene.children.length} objetos</p>
                    <p><strong>Câmera:</strong> posição(${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)})</p>
                    <p><strong>Renderer:</strong> ${renderer.domElement.width}x${renderer.domElement.height}</p>
                    <p><strong>Wireframe:</strong> ${wireframeMode ? 'Ativado' : 'Desativado'}</p>
                `;
            }
        }

        function init() {
            log("Inicializando cena 3D...");
            
            const container = document.getElementById('container');
            
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            // Câmera
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Chão
            const floorGeometry = new THREE.PlaneGeometry(20, 20);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Grade
            const gridHelper = new THREE.GridHelper(20, 20);
            scene.add(gridHelper);
            
            updateDebugInfo();
            render();
            log("Cena 3D inicializada com sucesso!");
        }

        function render() {
            requestAnimationFrame(render);
            renderer.render(scene, camera);
        }

        function createTruck() {
            log("Criando caminhão...");
            
            const truckGroup = new THREE.Group();
            
            // Dimensões do caminhão
            const length = 14.5;
            const width = 2.45;
            const height = 1.70;
            
            // Chão do caminhão
            const floorGeometry = new THREE.BoxGeometry(length, 0.2, width);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.position.y = 0;
            floor.castShadow = true;
            floor.receiveShadow = true;
            truckGroup.add(floor);
            
            // Paredes (wireframe para melhor visualização)
            const wallMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x666666, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            
            // Paredes laterais
            const wallGeometry = new THREE.BoxGeometry(0.1, height, width);
            const leftWall = new THREE.Mesh(wallGeometry, wallMaterial);
            leftWall.position.set(-length/2, height/2, 0);
            truckGroup.add(leftWall);
            
            const rightWall = new THREE.Mesh(wallGeometry, wallMaterial);
            rightWall.position.set(length/2, height/2, 0);
            truckGroup.add(rightWall);
            
            // Paredes frontais
            const frontWallGeometry = new THREE.BoxGeometry(length, height, 0.1);
            const frontWall = new THREE.Mesh(frontWallGeometry, wallMaterial);
            frontWall.position.set(0, height/2, -width/2);
            truckGroup.add(frontWall);
            
            const backWall = new THREE.Mesh(frontWallGeometry, wallMaterial);
            backWall.position.set(0, height/2, width/2);
            truckGroup.add(backWall);
            
            scene.add(truckGroup);
            log("Caminhão criado com dimensões: 14.5m x 2.45m x 1.70m");
        }

        function createItem(x, y, z, width, height, depth, color, name) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshLambertMaterial({ 
                color: color,
                transparent: false,
                opacity: 0.8
            });
            
            if (wireframeMode) {
                material.wireframe = true;
            }
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.name = name;
            
            // Adicionar bordas para melhor visualização
            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            mesh.add(edges);
            
            scene.add(mesh);
            return mesh;
        }

        function testSimplePacking() {
            log("Testando empacotamento simples...");
            
            clearScene();
            createTruck();
            
            // Dimensões do caminhão
            const truckLength = 14.5;
            const truckWidth = 2.45;
            const truckHeight = 1.70;
            
            // Criar itens de teste
            const items = [
                { name: 'Container', width: 1.15, height: 1.16, depth: 1.15, color: 0x88d8b0, quantity: 2 },
                { name: 'Balde', width: 0.32, height: 0.35, depth: 0.32, color: 0xff6b6b, quantity: 4 },
                { name: 'Galão', width: 0.20, height: 0.20, depth: 0.20, color: 0x45b7d1, quantity: 6 }
            ];
            
            // Sistema de empacotamento simples
            let currentX = -truckLength/2 + 1;
            let currentZ = -truckWidth/2 + 0.5;
            let currentY = 0.1;
            
            items.forEach(itemType => {
                log(`Empacotando ${itemType.quantity} ${itemType.name}s...`);
                
                for (let i = 0; i < itemType.quantity; i++) {
                    // Verificar se cabe na posição atual
                    if (currentX + itemType.width/2 > truckLength/2 - 0.1) {
                        // Mudar para próxima linha em Z
                        currentX = -truckLength/2 + 1;
                        currentZ += itemType.depth + 0.2;
                        
                        if (currentZ + itemType.depth/2 > truckWidth/2 - 0.1) {
                            log("Não há mais espaço no caminhão!");
                            return;
                        }
                    }
                    
                    // Verificar altura
                    if (currentY + itemType.height > truckHeight - 0.1) {
                        log("Altura máxima atingida!");
                        return;
                    }
                    
                    // Criar item
                    createItem(
                        currentX, 
                        currentY + itemType.height/2, 
                        currentZ, 
                        itemType.width, 
                        itemType.height, 
                        itemType.depth, 
                        itemType.color, 
                        `${itemType.name}_${i+1}`
                    );
                    
                    log(`  ${itemType.name} ${i+1}: posição (${currentX.toFixed(2)}, ${(currentY + itemType.height/2).toFixed(2)}, ${currentZ.toFixed(2)})`);
                    
                    // Avançar para próxima posição
                    currentX += itemType.width + 0.1;
                }
            });
            
            updateDebugInfo();
            log("Empacotamento simples concluído!");
        }

        function testRealPacking() {
            log("Testando empacotamento real (casa-tintas)...");
            
            clearScene();
            createTruck();
            
            // Carga real da Casa das Tintas
            const items = [
                { name: 'Container', width: 1.15, height: 1.16, depth: 1.15, color: 0x88d8b0, quantity: 2 },
                { name: 'Balde 25kg', width: 0.32, height: 0.31, depth: 0.32, color: 0xff6b6b, quantity: 460 },
                { name: 'Galão 3.6L', width: 0.20, height: 0.20, depth: 0.20, color: 0x45b7d1, quantity: 20 }
            ];
            
            // Ordenar por tamanho (maiores primeiro)
            items.sort((a, b) => (b.width * b.height * b.depth) - (a.width * a.height * a.depth));
            
            // Dimensões do caminhão
            const truckLength = 14.5;
            const truckWidth = 2.45;
            const truckHeight = 1.70;
            
            // Grid de ocupação
            const gridSize = 0.05;
            const occupied = new Set();
            
            function checkCollision(x, z, width, depth) {
                const minX = Math.floor((x - width/2) / gridSize);
                const maxX = Math.floor((x + width/2) / gridSize);
                const minZ = Math.floor((z - depth/2) / gridSize);
                const maxZ = Math.floor((z + depth/2) / gridSize);
                
                for (let gx = minX; gx <= maxX; gx++) {
                    for (let gz = minZ; gz <= maxZ; gz++) {
                        if (occupied.has(`${gx},${gz}`)) {
                            return true;
                        }
                    }
                }
                return false;
            }
            
            function markOccupied(x, z, width, depth) {
                const minX = Math.floor((x - width/2) / gridSize);
                const maxX = Math.floor((x + width/2) / gridSize);
                const minZ = Math.floor((z - depth/2) / gridSize);
                const maxZ = Math.floor((z + depth/2) / gridSize);
                
                for (let gx = minX; gx <= maxX; gx++) {
                    for (let gz = minZ; gz <= maxZ; gz++) {
                        occupied.add(`${gx},${gz}`);
                    }
                }
            }
            
            let totalPlaced = 0;
            
            items.forEach(itemType => {
                log(`Empacotando ${itemType.quantity} ${itemType.name}s (${itemType.width}x${itemType.height}x${itemType.depth})...`);
                
                let placed = 0;
                
                for (let i = 0; i < itemType.quantity; i++) {
                    let positionFound = false;
                    
                    // Buscar posição de trás para frente
                    for (let z = -truckWidth/2 + itemType.depth/2; z <= truckWidth/2 - itemType.depth/2; z += 0.1) {
                        for (let x = -truckLength/2 + itemType.width/2; x <= truckLength/2 - itemType.width/2; x += 0.1) {
                            if (!checkCollision(x, z, itemType.width, itemType.depth)) {
                                // Tentar empilhar verticalmente
                                let y = 0.1;
                                let canStack = true;
                                
                                while (y + itemType.height <= truckHeight - 0.1) {
                                    const testY = y + itemType.height/2;
                                    
                                    // Verificar colisão vertical (simplificada)
                                    if (checkCollision(x, z, itemType.width, itemType.depth)) {
                                        canStack = false;
                                        break;
                                    }
                                    
                                    y += itemType.height + 0.02;
                                }
                                
                                if (canStack) {
                                    // Posicionar item
                                    const finalY = y - itemType.height - 0.02 + itemType.height/2;
                                    
                                    createItem(
                                        x, 
                                        finalY, 
                                        z, 
                                        itemType.width, 
                                        itemType.height, 
                                        itemType.depth, 
                                        itemType.color, 
                                        `${itemType.name}_${i+1}`
                                    );
                                    
                                    markOccupied(x, z, itemType.width, itemType.depth);
                                    
                                    log(`  ${itemType.name} ${i+1}: posição (${x.toFixed(2)}, ${finalY.toFixed(2)}, ${z.toFixed(2)})`);
                                    
                                    placed++;
                                    totalPlaced++;
                                    positionFound = true;
                                    break;
                                }
                            }
                        }
                        if (positionFound) break;
                    }
                    
                    if (!positionFound) {
                        log(`  Não foi possível posicionar ${itemType.name} ${i+1}`);
                    }
                }
                
                log(`  ${placed}/${itemType.quantity} ${itemType.name}s posicionados`);
            });
            
            updateDebugInfo();
            log(`Empacotamento real concluído! Total posicionados: ${totalPlaced}`);
        }

        function clearScene() {
            log("Limpando cena...");
            
            const objectsToRemove = [];
            scene.traverse((child) => {
                if (child.type === 'Mesh' || child.type === 'Group') {
                    objectsToRemove.push(child);
                }
            });
            
            objectsToRemove.forEach(obj => {
                scene.remove(obj);
            });
            
            updateDebugInfo();
            log(`Cena limpa. ${objectsToRemove.length} objetos removidos.`);
        }

        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            log(`Wireframe ${wireframeMode ? 'ativado' : 'desativado'}`);
            
            scene.traverse((child) => {
                if (child.type === 'Mesh' && child.material) {
                    child.material.wireframe = wireframeMode;
                }
            });
            
            updateDebugInfo();
        }

        // Inicializar ao carregar
        window.addEventListener('load', init);
        
        // Redimensionar
        window.addEventListener('resize', () => {
            const container = document.getElementById('container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            updateDebugInfo();
        });
    </script>
</body>
</html>
