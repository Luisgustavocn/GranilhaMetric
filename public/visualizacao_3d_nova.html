<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização 3D de Carga</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        body.embed-mode {
            background: transparent;
            min-height: auto;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        body.embed-mode .container {
            max-width: none;
            border-radius: 0;
            box-shadow: none;
        }

        body.embed-mode header,
        body.embed-mode .controls,
        body.embed-mode .info-panel {
            display: none !important;
        }

        body.embed-mode .visualization {
            height: 460px;
            border-bottom: 0;
        }

        body.embed-mode .stats {
            padding: 16px 0 0;
        }

        body.embed-mode .stat-card {
            box-shadow: 0 8px 22px rgba(23, 31, 44, 0.08);
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .control-group {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #495057;
        }

        select {
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .visualization {
            height: 500px;
            background: #f8f9fa;
            position: relative;
            border-bottom: 1px solid #e9ecef;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .stats {
            padding: 30px;
            background: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #495057;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 300px;
        }

        .info-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #495057;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .info-label {
            color: #6c757d;
        }

        .info-value {
            font-weight: 600;
            color: #495057;
        }
    </style>
</head>
<body>

        <section class="stats">

        const ORDER_PREVIEW_STORAGE_KEY = 'granilha_metric_order_3d_preview';

        function loadOrderPreviewData() {
            try {
                const raw = window.localStorage.getItem(ORDER_PREVIEW_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || !parsed.clients || typeof parsed.clients !== 'object') {
                    return null;
                }
                return parsed;
            } catch (_error) {
                return null;
            }
        }

        const ORDER_PREVIEW_DATA = loadOrderPreviewData();
        const CLIENT_DATA = ORDER_PREVIEW_DATA?.clients && Object.keys(ORDER_PREVIEW_DATA.clients).length
            ? ORDER_PREVIEW_DATA.clients
            : DEFAULT_CLIENT_DATA;

        const TRUCK_DIMENSIONS = {
            length: 14.5,
            width: 2.45,
            height: 1.70
        };

        const PACKING_BATCH_SIZE = 40;
        const ENTRY_ORDER_STRATEGIES = [
            'footprint',
            'height',
            'width',
            'original',
            'footprint_reverse',
            'height_reverse',
            'width_reverse',
            'original_reverse'
        ];
        const GAP = 0.002;
        const ORDER_GAP = 0.015;
        const POSITION_EPSILON = 0.0015;
        const FLOOR_Y = Math.min(0.015, TRUCK_DIMENSIONS.height * 0.04);
        const MIN_X_LIMIT = -TRUCK_DIMENSIONS.length / 2 + GAP;
        const REAR_START_X = TRUCK_DIMENSIONS.length / 2 - GAP;
        const MIN_Z_EDGE = -TRUCK_DIMENSIONS.width / 2 + GAP;
        const MAX_Z_EDGE = TRUCK_DIMENSIONS.width / 2 - GAP;
        const USABLE_HEIGHT = TRUCK_DIMENSIONS.height - FLOOR_Y * 2;

        let scene, camera, renderer;
        let truck, cargoGroup;
        let isLoading = false;
        let currentRenderToken = 0;
        let loadingStageLabel = 'Processando carga...';

        function populateClientSelect() {
            const select = document.getElementById('client-select');
            if (!select) return;

            const options = ['<option value="">Escolha um cliente...</option>'];
            Object.entries(CLIENT_DATA).forEach(([key, client]) => {
                options.push(`<option value="${key}">${client.name}</option>`);
            });
            options.push('<option value="all">Todos os Clientes</option>');
            select.innerHTML = options.join('');
        }

        function applyOrderPreviewHeader() {
            if (!ORDER_PREVIEW_DATA) return;
            const subtitle = document.getElementById('page-subtitle');
            if (subtitle) {
                subtitle.textContent = `${ORDER_PREVIEW_DATA.title || 'Pedido salvo'} carregado para visualização 3D`;
            }
        }

        function hashOrderKey(orderKey) {
            const normalizedKey = String(orderKey || 'pedido');
            let hash = 0;
            for (let index = 0; index < normalizedKey.length; index++) {
                hash = ((hash << 5) - hash) + normalizedKey.charCodeAt(index);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function hslToHex(h, s, l) {
            const hue = ((h % 360) + 360) % 360 / 360;
            const saturation = Math.max(0, Math.min(1, s / 100));
            const lightness = Math.max(0, Math.min(1, l / 100));

            if (saturation === 0) {
                const gray = Math.round(lightness * 255);
                return (gray << 16) | (gray << 8) | gray;
            }

            const q = lightness < 0.5
                ? lightness * (1 + saturation)
                : lightness + saturation - lightness * saturation;
            const p = 2 * lightness - q;

            function hueToRgb(t) {
                let value = t;
                if (value < 0) value += 1;
                if (value > 1) value -= 1;
                if (value < 1 / 6) return p + (q - p) * 6 * value;
                if (value < 1 / 2) return q;
                if (value < 2 / 3) return p + (q - p) * (2 / 3 - value) * 6;
                return p;
            }

            const r = Math.round(hueToRgb(hue + 1 / 3) * 255);
            const g = Math.round(hueToRgb(hue) * 255);
            const b = Math.round(hueToRgb(hue - 1 / 3) * 255);
            return (r << 16) | (g << 8) | b;
        }

        function getOrderColor(orderKey) {
            const hash = hashOrderKey(orderKey);
            const hue = (hash * 137.508) % 360;
            const saturation = 62 + (hash % 14);
            const lightness = 50 + ((Math.floor(hash / 7)) % 10);
            return hslToHex(hue, saturation, lightness);
        }

        function init() {
            const container = document.getElementById('canvas-container');
            populateClientSelect();
            applyOrderPreviewHeader();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            scene.fog = new THREE.Fog(0xf0f0f0, 50, 200);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(15, 10, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            setupLighting();
            setupControls();
            createTruck();
            animate();
            window.addEventListener('resize', onWindowResize);

            if (ORDER_PREVIEW_DATA) {
                const select = document.getElementById('client-select');
                if (select) {
                    select.value = 'all';
                }
                renderCargo();
            }
        }

        function setupLighting() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 30, 20);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);

            const fillLight = new THREE.DirectionalLight(0x87ceeb, 0.3);
            fillLight.position.set(-10, 15, -10);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 0.2);
            rimLight.position.set(0, 10, -20);
            scene.add(rimLight);
        }

        function setupControls() {
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            scene.userData.updateCamera = () => {
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;

                const radius = 20;
                camera.position.x = Math.sin(targetX * Math.PI) * radius;
                camera.position.z = Math.cos(targetX * Math.PI) * radius;
                camera.position.y = 10 + targetY * 5;
                camera.lookAt(0, 0, 0);
            };
        }

        function createTruck() {
            const { length, width, height } = TRUCK_DIMENSIONS;
            truck = new THREE.Group();

            const floorGeometry = new THREE.BoxGeometry(length, 0.2, width);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x8b4513,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.position.y = 0;
            floor.castShadow = true;
            floor.receiveShadow = true;
            truck.add(floor);

            const wallMaterial = new THREE.MeshBasicMaterial({
                color: 0x666666,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });

            const rearFrontWallGeometry = new THREE.BoxGeometry(0.1, height, width);
            const frontWall = new THREE.Mesh(rearFrontWallGeometry, wallMaterial);
            frontWall.position.set(-length / 2, height / 2, 0);
            truck.add(frontWall);

            const rearWall = new THREE.Mesh(rearFrontWallGeometry, wallMaterial);
            rearWall.position.set(length / 2, height / 2, 0);
            truck.add(rearWall);

            const sideWallGeometry = new THREE.BoxGeometry(length, height, 0.1);
            const leftWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            leftWall.position.set(0, height / 2, -width / 2);
            truck.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            rightWall.position.set(0, height / 2, width / 2);
            truck.add(rightWall);

            scene.add(truck);

            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0xe0e0e0,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            scene.add(new THREE.GridHelper(50, 50, 0xcccccc, 0xeeeeee));
        }

        function nextFrame() {
            return new Promise((resolve) => requestAnimationFrame(resolve));
        }

        function getClientDataForSelection(clientKey) {
            if (clientKey === 'all') {
                return {
                    name: 'Todos os Clientes',

            return CLIENT_DATA[clientKey];

        function collectItems(clientKey) {
            const items = [];

            if (clientKey === 'all') {
                Object.entries(CLIENT_DATA).forEach(([key, client]) => {
                    client.items.forEach((item, itemIndex) => {
                        for (let index = 0; index < item.quantity; index++) {
                            items.push({
                                name: item.name,
                                dimensions: [...item.dimensions],
                                color: getOrderColor(key),
                                clientKey: key,
                                clientName: client.name,
                                sourceIndex: itemIndex,
                                sourceKey: `${key}:${itemIndex}:${item.name}`
                            });
                        }
                    });
                });
                return items;
            }

            const client = CLIENT_DATA[clientKey];
            client.items.forEach((item, itemIndex) => {
                for (let index = 0; index < item.quantity; index++) {
                    items.push({
                        name: item.name,
                        dimensions: [...item.dimensions],
                        color: getOrderColor(clientKey),
                        clientKey,
                        clientName: client.name,
                        sourceIndex: itemIndex,
                        sourceKey: `${clientKey}:${itemIndex}:${item.name}`
                    });
                }
            });
            return items;
        }

        function buildGroupsForClient(items, clientKey) {
            const groups = new Map();

            items
                .filter((item) => item.clientKey === clientKey)
                .forEach((item) => {
                    const key = item.sourceKey || `${item.name}:${item.dimensions.join('x')}`;
                    if (!groups.has(key)) {
                        const [width, height, depth] = item.dimensions;
                        groups.set(key, {
                            key,
                            name: item.name,
                            clientKey,
                            clientName: item.clientName,
                            color: item.color,
                            dimensions: [...item.dimensions],
                            itemWidth: width,
                            itemHeight: height,
                            itemDepth: depth,
                            footprint: width * depth,
                            volume: width * height * depth,
                            orderIndex: Number(item.sourceIndex || 0),
                            items: []
                        });
                    }
                    groups.get(key).items.push(item);
                });

            return Array.from(groups.values()).sort((a, b) => a.orderIndex - b.orderIndex);
        }

        function buildClientBlocks(clientKey, allItems) {
            const clientKeys = clientKey === 'all' ? Object.keys(CLIENT_DATA) : [clientKey];
            const blocks = clientKeys.map((key) => {
                const groups = buildGroupsForClient(allItems, key);
                const totalVolume = groups.reduce((sum, group) => sum + group.volume * group.items.length, 0);
                const totalItems = groups.reduce((sum, group) => sum + group.items.length, 0);
                const weightedFootprint = groups.reduce((sum, group) => sum + (group.footprint * group.items.length), 0);
                const minFloorSpan = groups.reduce((minValue, group) => {
                    return Math.min(minValue, Math.min(group.itemWidth, group.itemDepth));
                }, Number.POSITIVE_INFINITY);
                const maxGroupWidth = groups.reduce((maxValue, group) => Math.max(maxValue, group.itemWidth), 0);
                const maxFootprint = groups.reduce((maxValue, group) => Math.max(maxValue, group.footprint), 0);

                return {
                    clientKey: key,
                    clientName: CLIENT_DATA[key].name,
                    color: getOrderColor(key),
                    groups,
                    totalVolume,
                    averageFootprint: totalItems ? weightedFootprint / totalItems : 0,
                    maxFootprint,
                    minFloorSpan: Number.isFinite(minFloorSpan) ? minFloorSpan : 0,
                    maxGroupWidth,
                    minimalLength: Math.max(
                        maxGroupWidth + GAP * 2,
                        totalVolume / Math.max((MAX_Z_EDGE - MIN_Z_EDGE) * USABLE_HEIGHT, POSITION_EPSILON)
                    )
                };
            });

            return blocks;
        }

        function getUniqueOrientations(width, height, depth) {
            return [
                { width, height, depth, rotated: false },
                { width: depth, height, depth: width, rotated: true }
            ].filter((orientation, index, list) => {
                return index === list.findIndex((candidate) =>
                    Math.abs(candidate.width - orientation.width) <= POSITION_EPSILON &&
                    Math.abs(candidate.depth - orientation.depth) <= POSITION_EPSILON
                );
            });
        }

        function scoreLayout(layout, minFloorSpan) {
            const fragments = layout.map((slot) => {
                const width = slot.xMax - slot.xMin;
                const depth = slot.zMax - slot.zMin;
                return {
                    area: width * depth,
                    minSpan: Math.min(width, depth)
                };
            });

            return {
                fragmentCount: fragments.length,
                unusableCount: fragments.filter((fragment) => fragment.minSpan < minFloorSpan - POSITION_EPSILON).length,
                maxSpan: fragments.reduce((value, fragment) => Math.max(value, fragment.minSpan), 0),
                maxArea: fragments.reduce((value, fragment) => Math.max(value, fragment.area), 0)
            };
        }

        function chooseBestRemainderLayout(layouts, minFloorSpan) {
            return layouts.reduce((bestLayout, currentLayout) => {
                if (!bestLayout) {
                    return currentLayout;
                }

                const bestScore = scoreLayout(bestLayout, minFloorSpan);
                const currentScore = scoreLayout(currentLayout, minFloorSpan);
                if (currentScore.fragmentCount !== bestScore.fragmentCount) {
                    return currentScore.fragmentCount < bestScore.fragmentCount ? currentLayout : bestLayout;
                }
                if (currentScore.unusableCount !== bestScore.unusableCount) {
                    return currentScore.unusableCount < bestScore.unusableCount ? currentLayout : bestLayout;
                }
                if (Math.abs(currentScore.maxSpan - bestScore.maxSpan) > POSITION_EPSILON) {
                    return currentScore.maxSpan > bestScore.maxSpan ? currentLayout : bestLayout;
                }
                return currentScore.maxArea > bestScore.maxArea + POSITION_EPSILON ? currentLayout : bestLayout;
            }, null) || [];
        }

        function getLateralAnchors(slot, placement) {
            const rearAnchors = [
                slot.zMin,
                slot.zMax - placement.depth
            ];

            return rearAnchors.filter((anchor, index, list) => {
                return anchor >= slot.zMin - POSITION_EPSILON &&
                    anchor + placement.depth <= slot.zMax + POSITION_EPSILON &&
                    index === list.findIndex((candidate) => Math.abs(candidate - anchor) <= POSITION_EPSILON);
            });
        }

        function buildRemainderLayouts(slot, placement, usedZMin) {
            const usedXMax = slot.xMax;
            const usedXMin = slot.xMax - placement.width;
            const usedZMax = slot.zMin + placement.depth;
            const actualUsedZMin = usedZMin;
            const actualUsedZMax = usedZMin + placement.depth;

            const widthFirst = [];
            if (usedXMin - slot.xMin > POSITION_EPSILON) {
                widthFirst.push({
                    xMin: slot.xMin,
                    xMax: usedXMin,
                    zMin: slot.zMin,
                    zMax: slot.zMax,
                    baseY: slot.baseY,
                    stackLevel: slot.stackLevel,
                    groupKey: slot.groupKey,
                    clientKey: slot.clientKey
                });
            }
            if (actualUsedZMin - slot.zMin > POSITION_EPSILON) {
                widthFirst.push({
                    xMin: usedXMin,
                    xMax: slot.xMax,
                    zMin: slot.zMin,
                    zMax: actualUsedZMin,
                    baseY: slot.baseY,
                    stackLevel: slot.stackLevel,
                    groupKey: slot.groupKey,
                    clientKey: slot.clientKey
                });
            }
            if (slot.zMax - actualUsedZMax > POSITION_EPSILON) {
                widthFirst.push({
                    xMin: usedXMin,
                    xMax: slot.xMax,
                    zMin: actualUsedZMax,
                    zMax: slot.zMax,
                    baseY: slot.baseY,
                    stackLevel: slot.stackLevel,
                    groupKey: slot.groupKey,
                    clientKey: slot.clientKey
                });
            }

            const depthFirst = [];
            if (actualUsedZMin - slot.zMin > POSITION_EPSILON) {
                depthFirst.push({
                    xMin: slot.xMin,
                    xMax: slot.xMax,
                    zMin: slot.zMin,
                    zMax: actualUsedZMin,
                    baseY: slot.baseY,
                    stackLevel: slot.stackLevel,
                    groupKey: slot.groupKey,
                    clientKey: slot.clientKey
                });
            }
            if (slot.zMax - actualUsedZMax > POSITION_EPSILON) {
                depthFirst.push({
                    xMin: slot.xMin,
                    xMax: slot.xMax,
                    zMin: actualUsedZMax,
                    zMax: slot.zMax,
                    baseY: slot.baseY,
                    stackLevel: slot.stackLevel,
                    groupKey: slot.groupKey,
                    clientKey: slot.clientKey
                });
            }
            if (usedXMin - slot.xMin > POSITION_EPSILON) {
                depthFirst.push({
                    xMin: slot.xMin,
                    xMax: usedXMin,
                    zMin: actualUsedZMin,
                    zMax: actualUsedZMax,
                    baseY: slot.baseY,
                    stackLevel: slot.stackLevel,
                    groupKey: slot.groupKey,
                    clientKey: slot.clientKey
                });
            }

            return {
                usedXMin,
                usedXMax,
                usedZMin: actualUsedZMin,
                usedZMax: actualUsedZMax,
                layouts: [widthFirst, depthFirst]
            };
        }

        function nearlyEqual(a, b) {
            return Math.abs(a - b) <= POSITION_EPSILON;
        }

        function rangesTouch(minA, maxA, minB, maxB) {
            return Math.abs(maxA - minB) <= POSITION_EPSILON || Math.abs(maxB - minA) <= POSITION_EPSILON;
        }

        function buildMergedSlot(state, slotIndex) {
            const seedSlot = state.slots[slotIndex];
            const consumedIndexes = new Set([slotIndex]);
            const mergedSlot = {
                xMin: seedSlot.xMin,
                xMax: seedSlot.xMax,
                zMin: seedSlot.zMin,
                zMax: seedSlot.zMax,
                baseY: seedSlot.baseY,
                stackLevel: seedSlot.stackLevel,
                groupKey: seedSlot.groupKey,
                clientKey: seedSlot.clientKey
            };

            let changed = true;
            while (changed) {
                changed = false;

                for (let index = 0; index < state.slots.length; index++) {
                    if (consumedIndexes.has(index)) {
                        continue;
                    }

                    const slot = state.slots[index];
                    if (!nearlyEqual(slot.baseY, mergedSlot.baseY) || slot.stackLevel !== mergedSlot.stackLevel) {
                        continue;
                    }

                    if (
                        nearlyEqual(slot.xMin, mergedSlot.xMin) &&
                        nearlyEqual(slot.xMax, mergedSlot.xMax) &&
                        rangesTouch(mergedSlot.zMin, mergedSlot.zMax, slot.zMin, slot.zMax)
                    ) {
                        mergedSlot.zMin = Math.min(mergedSlot.zMin, slot.zMin);
                        mergedSlot.zMax = Math.max(mergedSlot.zMax, slot.zMax);
                        consumedIndexes.add(index);
                        changed = true;
                        continue;
                    }

                    if (
                        nearlyEqual(slot.zMin, mergedSlot.zMin) &&
                        nearlyEqual(slot.zMax, mergedSlot.zMax) &&
                        rangesTouch(mergedSlot.xMin, mergedSlot.xMax, slot.xMin, slot.xMax)
                    ) {
                        mergedSlot.xMin = Math.min(mergedSlot.xMin, slot.xMin);
                        mergedSlot.xMax = Math.max(mergedSlot.xMax, slot.xMax);
                        consumedIndexes.add(index);
                        changed = true;
                    }
                }
            }

            return {
                slot: mergedSlot,
                slotIndexes: [...consumedIndexes].sort((a, b) => b - a)
            };
        }

        function previewPlacement(slot, entry, maxLayers = Infinity) {
            const supportWidth = slot.xMax - slot.xMin;
            const supportDepth = slot.zMax - slot.zMin;
            let best = null;

            if (slot.baseY + entry.itemHeight > TRUCK_DIMENSIONS.height - FLOOR_Y + POSITION_EPSILON) {
                return null;
            }

            for (const orientation of getUniqueOrientations(entry.itemWidth, entry.itemHeight, entry.itemDepth)) {
                if (orientation.width > supportWidth + POSITION_EPSILON || orientation.depth > supportDepth + POSITION_EPSILON) {
                    continue;
                }

                if (slot.stackLevel + 1 > maxLayers) {
                    continue;
                }

                const placement = {
                    width: orientation.width,
                    height: entry.itemHeight,
                    depth: orientation.depth,
                    rotated: orientation.rotated,
                    y: slot.baseY + entry.itemHeight / 2,
                    baseY: slot.baseY,
                    layer: slot.baseY <= FLOOR_Y + POSITION_EPSILON ? 'fundo_chao' : 'fundo_empilhado',
                    supportArea: supportWidth * supportDepth,
                    minSupportSpan: Math.min(supportWidth, supportDepth),
                    wasteArea: supportWidth * supportDepth - orientation.width * orientation.depth,
                    topY: slot.baseY + entry.itemHeight,
                    stackLevel: slot.stackLevel + 1
                };

                if (
                    !best ||
                    placement.wasteArea < best.wasteArea - POSITION_EPSILON ||
                    (
                        Math.abs(placement.wasteArea - best.wasteArea) <= POSITION_EPSILON &&
                        placement.depth < best.depth - POSITION_EPSILON
                    )
                ) {
                    best = placement;
                }
            }

            return best;
        }

        function getBestAnchorLayout(state, slot, placement) {
            const lateralAnchors = slot.baseY <= FLOOR_Y + POSITION_EPSILON
                ? getLateralAnchors(slot, placement)
                : [slot.zMin];
            let bestAnchorLayout = null;

            lateralAnchors.forEach((anchorZMin) => {
                const layoutCandidate = buildRemainderLayouts(slot, placement, anchorZMin);
                const remainderLayout = chooseBestRemainderLayout(layoutCandidate.layouts, state.minFloorSpan);
                const centerZ = anchorZMin + placement.depth / 2;
                const layoutScore = scoreLayout(remainderLayout, state.minFloorSpan);
                const anchorRecord = {
                    ...layoutCandidate,
                    remainders: remainderLayout,
                    centerZ,
                    layoutScore
                };

                if (!bestAnchorLayout) {
                    bestAnchorLayout = anchorRecord;
                    return;
                }

                if (layoutScore.fragmentCount !== bestAnchorLayout.layoutScore.fragmentCount) {
                    if (layoutScore.fragmentCount < bestAnchorLayout.layoutScore.fragmentCount) {
                        bestAnchorLayout = anchorRecord;
                    }
                    return;
                }

                if (layoutScore.unusableCount !== bestAnchorLayout.layoutScore.unusableCount) {
                    if (layoutScore.unusableCount < bestAnchorLayout.layoutScore.unusableCount) {
                        bestAnchorLayout = anchorRecord;
                    }
                    return;
                }

                if (Math.abs(layoutScore.maxSpan - bestAnchorLayout.layoutScore.maxSpan) > POSITION_EPSILON) {
                    if (layoutScore.maxSpan > bestAnchorLayout.layoutScore.maxSpan) {
                        bestAnchorLayout = anchorRecord;
                    }
                    return;
                }

                if (layoutScore.maxArea > bestAnchorLayout.layoutScore.maxArea + POSITION_EPSILON) {
                    bestAnchorLayout = anchorRecord;
                }
            });

            return bestAnchorLayout;
        }

        function isBetterFloorCandidate(current, best) {
            if (!best) {
                return true;
            }

            if (Math.abs(current.clusterGap - best.clusterGap) > POSITION_EPSILON) {
                return current.clusterGap < best.clusterGap;
            }
            if (current.anchorLayout.layoutScore.fragmentCount !== best.anchorLayout.layoutScore.fragmentCount) {
                return current.anchorLayout.layoutScore.fragmentCount < best.anchorLayout.layoutScore.fragmentCount;
            }
            if (Math.abs(current.slot.xMax - best.slot.xMax) > POSITION_EPSILON) {
                return current.slot.xMax > best.slot.xMax;
            }
            if (current.anchorLayout.layoutScore.unusableCount !== best.anchorLayout.layoutScore.unusableCount) {
                return current.anchorLayout.layoutScore.unusableCount < best.anchorLayout.layoutScore.unusableCount;
            }
            if (Math.abs(current.anchorLayout.layoutScore.maxSpan - best.anchorLayout.layoutScore.maxSpan) > POSITION_EPSILON) {
                return current.anchorLayout.layoutScore.maxSpan > best.anchorLayout.layoutScore.maxSpan;
            }
            if (Math.abs(current.placement.supportArea - best.placement.supportArea) > POSITION_EPSILON) {
                return current.placement.supportArea > best.placement.supportArea;
            }
            return current.placement.wasteArea < best.placement.wasteArea - POSITION_EPSILON;
        }

        function isBetterTopCandidate(current, best) {
            if (!best) {
                return true;
            }

            if (current.placement.stackLevel !== best.placement.stackLevel) {
                return current.placement.stackLevel < best.placement.stackLevel;
            }
            if (current.sameClient !== best.sameClient) {
                return current.sameClient;
            }
            if (Math.abs(current.clusterGap - best.clusterGap) > POSITION_EPSILON) {
                return current.clusterGap < best.clusterGap;
            }
            if (Math.abs(current.placement.topY - best.placement.topY) > POSITION_EPSILON) {
                return current.placement.topY < best.placement.topY;
            }
            if (current.sameGroup !== best.sameGroup) {
                return current.sameGroup;
            }
            if (Math.abs(current.placement.supportArea - best.placement.supportArea) > POSITION_EPSILON) {
                return current.placement.supportArea > best.placement.supportArea;
            }
            return current.placement.wasteArea < best.placement.wasteArea - POSITION_EPSILON;
        }

        function getCandidateClusterGap(state, candidate) {
            const anchor = candidate.anchorLayout;
            if (!anchor) {
                return Number.POSITIVE_INFINITY;
            }

            if (state.clusterMinX === null || state.clusterMaxX === null) {
                return 0;
            }

            const clusterMinX = state.clusterMinX;
            const clusterMaxX = state.clusterMaxX;
            if (anchor.usedXMax < clusterMinX - POSITION_EPSILON) {
                return clusterMinX - anchor.usedXMax;
            }
            if (anchor.usedXMin > clusterMaxX + POSITION_EPSILON) {
                return anchor.usedXMin - clusterMaxX;
            }
            return 0;
        }

        function findBestFloorCandidate(state, entry) {
            let best = null;

            for (let slotIndex = 0; slotIndex < state.slots.length; slotIndex++) {
                const merged = buildMergedSlot(state, slotIndex);
                const slot = merged.slot;
                if (slot.baseY > FLOOR_Y + POSITION_EPSILON) {
                    continue;
                }

                const placement = previewPlacement(slot, entry);
                if (!placement) {
                    continue;
                }

                const candidate = {
                    slotIndexes: merged.slotIndexes,
                    slot,
                    placement,
                    anchorLayout: getBestAnchorLayout(state, slot, placement)
                };
                candidate.clusterGap = getCandidateClusterGap(state, candidate);

                if (candidate.anchorLayout && isBetterFloorCandidate(candidate, best)) {
                    best = candidate;
                }
            }

            return best;
        }

        function findBestTopCandidate(state, entry, maxLayers = Infinity) {
            let best = null;

            for (let slotIndex = 0; slotIndex < state.slots.length; slotIndex++) {
                const merged = buildMergedSlot(state, slotIndex);
                const slot = merged.slot;
                if (slot.baseY <= FLOOR_Y + POSITION_EPSILON) {
                    continue;
                }

                const placement = previewPlacement(slot, entry, maxLayers);
                if (!placement) {
                    continue;
                }

                const candidate = {
                    slotIndexes: merged.slotIndexes,
                    slot,
                    placement,
                    anchorLayout: getBestAnchorLayout(state, slot, placement),
                    sameGroup: slot.groupKey === entry.groupKey,
                    sameClient: slot.clientKey === state.clientKey
                };
                candidate.clusterGap = getCandidateClusterGap(state, candidate);

                if (isBetterTopCandidate(candidate, best)) {
                    best = candidate;
                }
            }

            return best;
        }

        function placeCandidate(state, candidate, groupKey) {
            const slot = candidate.slot;
            const slotIndexes = Array.isArray(candidate.slotIndexes) ? candidate.slotIndexes : [];
            slotIndexes.forEach((index) => {
                state.slots.splice(index, 1);
            });
            const bestAnchorLayout = candidate.anchorLayout || getBestAnchorLayout(state, slot, candidate.placement);

            const {
                usedXMin,
                usedXMax,
                usedZMin,
                usedZMax,
                remainders
            } = bestAnchorLayout;
            remainders.forEach((remainder) => state.slots.push(remainder));

            const nextStackLevel = slot.stackLevel + 1;
            if (slot.baseY + candidate.placement.height < TRUCK_DIMENSIONS.height - FLOOR_Y - POSITION_EPSILON) {
                state.slots.push({
                    xMin: usedXMin,
                    xMax: usedXMax,
                    zMin: usedZMin,
                    zMax: usedZMax,
                    baseY: slot.baseY + candidate.placement.height,
                    stackLevel: nextStackLevel,
                    groupKey,
                    clientKey: state.clientKey
                });
            }

            if (slot.baseY <= FLOOR_Y + POSITION_EPSILON && slot.groupKey === state.floorGroupKey) {
                state.frontEdgeX = Math.min(state.frontEdgeX, usedXMin);
            }
            state.clusterMinX = state.clusterMinX === null ? usedXMin : Math.min(state.clusterMinX, usedXMin);
            state.clusterMaxX = state.clusterMaxX === null ? usedXMax : Math.max(state.clusterMaxX, usedXMax);
            state.maxStackLevel = Math.max(state.maxStackLevel, nextStackLevel);

            return {
                x: (usedXMin + usedXMax) / 2,
                y: candidate.placement.y,
                z: (usedZMin + usedZMax) / 2,
                width: candidate.placement.width,
                height: candidate.placement.height,
                depth: candidate.placement.depth,
                rotated: candidate.placement.rotated,
                layer: candidate.placement.layer,
                stackLevel: candidate.placement.stackLevel
            };
        }

        function buildStateForBlock(block, rearX, frontX) {
            const floorGroupKey = `__floor__:${block.clientKey}`;
            return {
                clientKey: block.clientKey,
                clientName: block.clientName,
                rearX,
                frontX,
                frontEdgeX: rearX,
                clusterMinX: null,
                clusterMaxX: null,
                minFloorSpan: block.minFloorSpan,
                averageFootprint: block.averageFootprint,
                largeFootprintThreshold: Math.max(block.averageFootprint * 1.15, block.maxFootprint * 0.55),
                floorGroupKey,
                externalSupportGapLimit: Math.max(block.maxGroupWidth * 0.4, block.minFloorSpan * 0.85, 0.14),
                maxStackLevel: 0,
                slots: [
                    {
                        xMin: frontX,
                        xMax: rearX,
                        zMin: MIN_Z_EDGE,
                        zMax: MAX_Z_EDGE,
                        baseY: FLOOR_Y,
                        stackLevel: 0,
                        groupKey: floorGroupKey,
                        clientKey: block.clientKey
                    }
                ]
            };
        }

        function buildEntriesForBlock(block, strategy = 'footprint') {
            const entries = [];
            const reverseOrder = strategy.endsWith('_reverse');
            const baseStrategy = reverseOrder ? strategy.replace('_reverse', '') : strategy;

            const orderedGroups = [...block.groups].sort((a, b) => {
                if (baseStrategy === 'original') {
                    return reverseOrder
                        ? (
                            b.orderIndex - a.orderIndex ||
                            b.footprint - a.footprint ||
                            b.volume - a.volume
                        )
                        : (
                            a.orderIndex - b.orderIndex ||
                            b.footprint - a.footprint ||
                            b.volume - a.volume
                        );
                }

                if (baseStrategy === 'height') {
                    return reverseOrder
                        ? (
                            a.itemHeight - b.itemHeight ||
                            b.footprint - a.footprint ||
                            b.volume - a.volume ||
                            a.orderIndex - b.orderIndex
                        )
                        : (
                            b.itemHeight - a.itemHeight ||
                            b.footprint - a.footprint ||
                            b.volume - a.volume ||
                            a.orderIndex - b.orderIndex
                        );
                }

                if (baseStrategy === 'width') {
                    return reverseOrder
                        ? (
                            Math.max(a.itemWidth, a.itemDepth) - Math.max(b.itemWidth, b.itemDepth) ||
                            b.footprint - a.footprint ||
                            b.volume - a.volume ||
                            a.orderIndex - b.orderIndex
                        )
                        : (
                            Math.max(b.itemWidth, b.itemDepth) - Math.max(a.itemWidth, a.itemDepth) ||
                            b.footprint - a.footprint ||
                            b.volume - a.volume ||
                            a.orderIndex - b.orderIndex
                        );
                }

                return reverseOrder
                    ? (
                        a.footprint - b.footprint ||
                        a.volume - b.volume ||
                        a.itemHeight - b.itemHeight ||
                        a.orderIndex - b.orderIndex
                    )
                    : (
                        b.footprint - a.footprint ||
                        b.volume - a.volume ||
                        b.itemHeight - a.itemHeight ||
                        a.orderIndex - b.orderIndex
                    );
            });

            orderedGroups.forEach((group) => {
                group.items.forEach((item) => {
                    entries.push({
                        item,
                        groupKey: group.key,
                        itemWidth: group.itemWidth,
                        itemHeight: group.itemHeight,
                        itemDepth: group.itemDepth,
                        footprint: group.footprint,
                        volume: group.volume,
                        orderIndex: group.orderIndex
                    });
                });
            });

            return entries;
        }

        function choosePlacementForEntry(state, entry, compactMode = false, aggressiveMode = false, rescueMode = false) {
            let floorCandidate = findBestFloorCandidate(state, entry);
            let topCandidate = findBestTopCandidate(state, entry, Infinity);
            const isLargeItem = entry.footprint >= state.largeFootprintThreshold - POSITION_EPSILON;

            if (
                floorCandidate &&
                state.clusterMinX !== null &&
                floorCandidate.clusterGap > state.externalSupportGapLimit + POSITION_EPSILON
            ) {
                floorCandidate = null;
            }

            if (
                topCandidate &&
                !topCandidate.sameClient &&
                topCandidate.clusterGap > state.externalSupportGapLimit + POSITION_EPSILON
            ) {
                topCandidate = null;
            }

            if (floorCandidate && topCandidate) {
                if (isLargeItem) {
                    return placeCandidate(state, floorCandidate, entry.groupKey);
                }

                const floorExpandsFront = floorCandidate.anchorLayout.usedXMin < state.frontEdgeX - POSITION_EPSILON;
                const floorCreatesFragments = floorCandidate.anchorLayout.layoutScore.fragmentCount > 1;
                const floorCreatesUnusable = floorCandidate.anchorLayout.layoutScore.unusableCount > 0;
                const topIsClose = topCandidate.sameClient &&
                    topCandidate.clusterGap <= state.externalSupportGapLimit + POSITION_EPSILON;
                const topUsesBroaderBase = topCandidate.placement.supportArea >
                    (entry.itemWidth * entry.itemDepth) + POSITION_EPSILON;
                const shouldUseTopToRescueLength = topIsClose && topUsesBroaderBase &&
                    (floorExpandsFront || floorCreatesFragments || floorCreatesUnusable);

                if ((aggressiveMode || rescueMode) && shouldUseTopToRescueLength) {
                    return placeCandidate(state, topCandidate, entry.groupKey);
                }

                return placeCandidate(state, floorCandidate, entry.groupKey);
            }

            return floorCandidate
                ? placeCandidate(state, floorCandidate, entry.groupKey)
                : topCandidate
                    ? placeCandidate(state, topCandidate, entry.groupKey)
                    : null;
        }

        function isPackingResultBetter(current, best) {
            if (!best) {
                return true;
            }
            if (current.placements.length !== best.placements.length) {
                return current.placements.length > best.placements.length;
            }
            if (current.maxStackLevel !== best.maxStackLevel) {
                return current.maxStackLevel < best.maxStackLevel;
            }
            if (Math.abs(current.stackHeightPenalty - best.stackHeightPenalty) > POSITION_EPSILON) {
                return current.stackHeightPenalty < best.stackHeightPenalty;
            }
            if ((current.layerStats.fundo_chao || 0) !== (best.layerStats.fundo_chao || 0)) {
                return (current.layerStats.fundo_chao || 0) > (best.layerStats.fundo_chao || 0);
            }
            if (Math.abs(current.usedLength - best.usedLength) > POSITION_EPSILON) {
                return current.usedLength < best.usedLength;
            }
            if ((current.layerStats.fundo_empilhado || 0) !== (best.layerStats.fundo_empilhado || 0)) {
                return (current.layerStats.fundo_empilhado || 0) < (best.layerStats.fundo_empilhado || 0);
            }
            return false;
        }

        function createBoxMesh(item, position) {
            const geometry = new THREE.BoxGeometry(position.width, position.height, position.depth);
            const material = new THREE.MeshStandardMaterial({
                color: item.color,
                roughness: 0.4,
                metalness: 0.1,
                transparent: false,
                opacity: 0.95
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position.x, position.y, position.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = {
                name: item.name,
                clientName: item.clientName,
                dimensions: [position.width, position.height, position.depth],
                layer: position.layer,
                rotated: Boolean(position.rotated),
                stackLevel: position.stackLevel
            };

            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 0.28
            });
            mesh.add(new THREE.LineSegments(edgesGeometry, edgesMaterial));
            cargoGroup.add(mesh);
        }

        function rangesOverlap(minA, maxA, minB, maxB) {
            return minA < maxB - POSITION_EPSILON && minB < maxA - POSITION_EPSILON;
        }

        function compactBlockPlacementsAlongX(blockPlacements, rearBoundaryX) {
            const indexed = blockPlacements.map((entry, index) => ({ ...entry, originalIndex: index }));
            const sorted = [...indexed].sort((a, b) => {
                const aMaxX = a.position.x + a.position.width / 2;
                const bMaxX = b.position.x + b.position.width / 2;
                return bMaxX - aMaxX;
            });
            const fixed = [];

            sorted.forEach((entry) => {
                const position = { ...entry.position };
                const currentMinX = position.x - position.width / 2;
                const currentMaxX = position.x + position.width / 2;
                let targetMaxX = rearBoundaryX;

                fixed.forEach((blocker) => {
                    const overlapY = rangesOverlap(
                        position.y - position.height / 2,
                        position.y + position.height / 2,
                        blocker.position.y - blocker.position.height / 2,
                        blocker.position.y + blocker.position.height / 2
                    );
                    const overlapZ = rangesOverlap(
                        position.z - position.depth / 2,
                        position.z + position.depth / 2,
                        blocker.position.z - blocker.position.depth / 2,
                        blocker.position.z + blocker.position.depth / 2
                    );

                    if (overlapY && overlapZ) {
                        const blockerMinX = blocker.position.x - blocker.position.width / 2;
                        targetMaxX = Math.min(targetMaxX, blockerMinX - GAP);
                    }
                });

                if (targetMaxX > currentMaxX + POSITION_EPSILON) {
                    position.x += targetMaxX - currentMaxX;
                }

                fixed.push({
                    ...entry,
                    position
                });
            });

            const placements = fixed
                .sort((a, b) => a.originalIndex - b.originalIndex)
                .map(({ originalIndex, ...entry }) => entry);
            const frontEdgeX = placements.reduce((minValue, entry) => {
                return Math.min(minValue, entry.position.x - entry.position.width / 2);
            }, rearBoundaryX);

            return { placements, frontEdgeX };
        }

        function compactBlockPlacementsAlongZ(blockPlacements) {
            const indexed = blockPlacements.map((entry, index) => ({ ...entry, originalIndex: index }));
            const sorted = [...indexed].sort((a, b) => {
                const aMinZ = a.position.z - a.position.depth / 2;
                const bMinZ = b.position.z - b.position.depth / 2;
                if ((a.position.z >= 0) !== (b.position.z >= 0)) {
                    return a.position.z < 0 ? -1 : 1;
                }
                if (a.position.z < 0 && b.position.z < 0) {
                    return aMinZ - bMinZ;
                }
                const aMaxZ = a.position.z + a.position.depth / 2;
                const bMaxZ = b.position.z + b.position.depth / 2;
                return bMaxZ - aMaxZ;
            });
            const fixed = [];

            sorted.forEach((entry) => {
                const position = { ...entry.position };
                const currentMinZ = position.z - position.depth / 2;
                const currentMaxZ = position.z + position.depth / 2;
                const moveToPositiveSide = position.z >= 0;

                if (moveToPositiveSide) {
                    let targetMaxZ = MAX_Z_EDGE;

                    fixed.forEach((blocker) => {
                        const overlapX = rangesOverlap(
                            position.x - position.width / 2,
                            position.x + position.width / 2,
                            blocker.position.x - blocker.position.width / 2,
                            blocker.position.x + blocker.position.width / 2
                        );
                        const overlapY = rangesOverlap(
                            position.y - position.height / 2,
                            position.y + position.height / 2,
                            blocker.position.y - blocker.position.height / 2,
                            blocker.position.y + blocker.position.height / 2
                        );

                        if (overlapX && overlapY && blocker.position.z >= -POSITION_EPSILON) {
                            const blockerMinZ = blocker.position.z - blocker.position.depth / 2;
                            targetMaxZ = Math.min(targetMaxZ, blockerMinZ - GAP);
                        }
                    });

                    if (targetMaxZ < currentMaxZ - POSITION_EPSILON) {
                        position.z -= currentMaxZ - targetMaxZ;
                    }
                } else {
                    let targetMinZ = MIN_Z_EDGE;

                    fixed.forEach((blocker) => {
                        const overlapX = rangesOverlap(
                            position.x - position.width / 2,
                            position.x + position.width / 2,
                            blocker.position.x - blocker.position.width / 2,
                            blocker.position.x + blocker.position.width / 2
                        );
                        const overlapY = rangesOverlap(
                            position.y - position.height / 2,
                            position.y + position.height / 2,
                            blocker.position.y - blocker.position.height / 2,
                            blocker.position.y + blocker.position.height / 2
                        );

                        if (overlapX && overlapY && blocker.position.z <= POSITION_EPSILON) {
                            const blockerMaxZ = blocker.position.z + blocker.position.depth / 2;
                            targetMinZ = Math.max(targetMinZ, blockerMaxZ + GAP);
                        }
                    });

                    if (targetMinZ > currentMinZ + POSITION_EPSILON) {
                        position.z += targetMinZ - currentMinZ;
                    }
                }

                fixed.push({
                    ...entry,
                    position
                });
            });

            return fixed
                .sort((a, b) => a.originalIndex - b.originalIndex)
                .map(({ originalIndex, ...entry }) => entry);
        }

        async function createCargo(clientKey, renderToken) {
            if (cargoGroup) {
                scene.remove(cargoGroup);
            }

            cargoGroup = new THREE.Group();

            const clientData = getClientDataForSelection(clientKey);
            if (!clientData) {
                return false;
            }

            const allItems = collectItems(clientKey);
            const blocks = buildClientBlocks(clientKey, allItems);
            async function runPacking(compactMode = false, aggressiveMode = false, rescueMode = false, entryStrategy = 'footprint') {
                const placements = [];
                const layerStats = { fundo_chao: 0, fundo_empilhado: 0 };
                let processedCount = 0;
                let totalVolume = 0;
                let currentRearX = REAR_START_X;
                let maxStackLevel = 0;
                let stackHeightPenalty = 0;
                const orderGap = rescueMode
                    ? Math.min(ORDER_GAP, 0.002)
                    : aggressiveMode
                    ? Math.min(ORDER_GAP, 0.005)
                    : compactMode ? Math.min(ORDER_GAP, 0.015) : ORDER_GAP;

                loadingStageLabel = rescueMode
                    ? 'Fazendo ajuste final para acomodar todos os volumes...'
                    : aggressiveMode
                    ? 'Buscando qualquer espaco util para caber tudo...'
                    : compactMode
                        ? 'Compactando carga para caber tudo...'
                        : (clientKey === 'all' ? 'Organizando pedidos no caminhão...' : 'Organizando carga do cliente...');
                updateLoadingProgress(0, allItems.length);

                for (const block of blocks) {
                    const remainingBlocks = blocks.slice(blocks.indexOf(block) + 1);
                    const reserveForRemaining = remainingBlocks.reduce((sum, remainingBlock) => {
                        return sum + remainingBlock.minimalLength;
                    }, 0) + orderGap * remainingBlocks.length;
                    const frontLimit = rescueMode
                        ? MIN_X_LIMIT
                        : clientKey === 'all'
                        ? Math.max(MIN_X_LIMIT, currentRearX - Math.max(block.minimalLength, currentRearX - MIN_X_LIMIT - reserveForRemaining))
                        : MIN_X_LIMIT;
                    const state = buildStateForBlock(block, currentRearX, frontLimit);
                    const entries = buildEntriesForBlock(block, entryStrategy);
                    const blockPlacements = [];

                    for (let itemIndex = 0; itemIndex < entries.length; itemIndex++) {
                        if (renderToken !== currentRenderToken) {
                            return null;
                        }

                        const entry = entries[itemIndex];
                        const position = choosePlacementForEntry(state, entry, compactMode, aggressiveMode, rescueMode);

                        processedCount++;
                        if (position) {
                            blockPlacements.push({ item: entry.item, position });
                            totalVolume += position.width * position.height * position.depth;
                            layerStats[position.layer] = (layerStats[position.layer] || 0) + 1;
                            maxStackLevel = Math.max(maxStackLevel, position.stackLevel || 0);
                            stackHeightPenalty += Math.pow(Math.max((position.stackLevel || 1) - 1, 0), 2);
                        }

                        if (processedCount % PACKING_BATCH_SIZE === 0 || processedCount === allItems.length) {
                            updateLoadingProgress(processedCount, allItems.length);
                            await nextFrame();
                        }
                    }

                    const laterallyCompactedBlock = compactBlockPlacementsAlongZ(blockPlacements);
                    const compactedBlock = compactBlockPlacementsAlongX(laterallyCompactedBlock, currentRearX);
                    placements.push(...compactedBlock.placements);
                    currentRearX = compactedBlock.frontEdgeX - orderGap;
                }

                return {
                    placements,
                    layerStats,
                    totalVolume,
                    maxStackLevel,
                    stackHeightPenalty,
                    usedLength: REAR_START_X - currentRearX
                };
            }

            let packingResult = null;
            const runVariants = [
                { compactMode: false, aggressiveMode: false, rescueMode: false },
                { compactMode: false, aggressiveMode: true, rescueMode: false },
                { compactMode: true, aggressiveMode: false, rescueMode: false },
                { compactMode: true, aggressiveMode: true, rescueMode: false },
                { compactMode: true, aggressiveMode: true, rescueMode: true }
            ];

            for (const variant of runVariants) {
                for (const strategy of ENTRY_ORDER_STRATEGIES) {
                    const candidate = await runPacking(
                        variant.compactMode,
                        variant.aggressiveMode,
                        variant.rescueMode,
                        strategy
                    );
                    if (!candidate) {
                        return false;
                    }
                    if (isPackingResultBetter(candidate, packingResult)) {
                        packingResult = candidate;
                    }
                    if (packingResult && packingResult.placements.length === allItems.length && packingResult.usedLength <= (TRUCK_DIMENSIONS.length + POSITION_EPSILON)) {
                        // still continue trying all variants only if we haven't fit everything compactly enough
                        if (!variant.rescueMode && strategy !== ENTRY_ORDER_STRATEGIES[ENTRY_ORDER_STRATEGIES.length - 1]) {
                            continue;
                        }
                    }
                }
            }
            if (!packingResult || packingResult.placements.length !== allItems.length) {
                document.getElementById('info-panel').style.display = 'none';
                updateStats(0, 0);
                return false;
            }

            const { placements, layerStats, totalVolume } = packingResult;

            scene.add(cargoGroup);
            loadingStageLabel = 'Renderizando carga...';
            updateLoadingProgress(0, placements.length);

            for (let startIndex = 0; startIndex < placements.length; startIndex += PACKING_BATCH_SIZE) {
                if (renderToken !== currentRenderToken) {
                    return false;
                }

                const batchEnd = Math.min(startIndex + PACKING_BATCH_SIZE, placements.length);
                for (let index = startIndex; index < batchEnd; index++) {
                    createBoxMesh(placements[index].item, placements[index].position);
                }

                updateLoadingProgress(batchEnd, placements.length);
                await nextFrame();
            }

            updateStats(placements.length, totalVolume);
            showInfoPanel(clientData, placements.length, allItems.length, layerStats, clientKey === 'all' ? 'multi' : 'single');
            return true;
        }

        function updateStats(placedCount, totalVolume) {
            const truckVolume = TRUCK_DIMENSIONS.length * TRUCK_DIMENSIONS.width * TRUCK_DIMENSIONS.height;
            const ocupacao = truckVolume > 0 ? (totalVolume / truckVolume) * 100 : 0;

            document.getElementById('volume-total').textContent = `${totalVolume.toFixed(2)} m³`;
            document.getElementById('items-count').textContent = String(placedCount);
            document.getElementById('ocupacao').textContent = `${ocupacao.toFixed(1)}%`;
            document.getElementById('eficiencia').textContent =
                ocupacao > 85 ? 'Excelente' : ocupacao > 70 ? 'Boa' : ocupacao > 50 ? 'Media' : 'Baixa';
        }

        function showInfoPanel(clientData, placedCount, totalItems, layerStats, mode) {
            const infoPanel = document.getElementById('info-panel');
            const infoContent = document.getElementById('info-content');
            const itemSummary = {};

            if (clientData.items) {
                clientData.items.forEach((item) => {
                    itemSummary[item.name] = (itemSummary[item.name] || 0) + item.quantity;
                });
            }

            let html = `
                <div class="info-item">
                    <span class="info-label">Cliente:</span>
                    <span class="info-value">${clientData.name}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Modo:</span>
                    <span class="info-value">${mode === 'multi' ? 'Pedidos agrupados e balanceados' : 'Carga balanceada do cliente'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Itens:</span>
                    <span class="info-value">${placedCount}/${totalItems}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">No chão:</span>
                    <span class="info-value">${layerStats.fundo_chao || 0}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Empilhados:</span>
                    <span class="info-value">${layerStats.fundo_empilhado || 0}</span>
                </div>
            `;

            Object.entries(itemSummary).forEach(([name, quantity]) => {
                html += `
                    <div class="info-item">
                        <span class="info-label">${name}:</span>
                        <span class="info-value">${quantity}</span>
                    </div>
                `;
            });

            infoContent.innerHTML = html;
            infoPanel.style.display = 'block';
        }

        function updateLoadingProgress(processed, total) {
            const loadingText = document.getElementById('loading-text');
            if (!loadingText) {
                return;
            }

            if (!total) {
                loadingText.textContent = loadingStageLabel;
                return;
            }

            const percentage = Math.round((processed / total) * 100);
            loadingText.textContent = `${loadingStageLabel} ${processed}/${total} (${percentage}%)`;
        }

        async function renderCargo() {
            const selectedClient = document.getElementById('client-select').value;
            if (!selectedClient) {
                alert('Por favor, selecione um cliente.');
                return;
            }

            const renderToken = ++currentRenderToken;
            showLoading(true);
            updateLoadingProgress(0, 0);

            try {
                await nextFrame();
                const success = await createCargo(selectedClient, renderToken);
                if (!success && renderToken === currentRenderToken) {
                    alert('Nao foi possivel organizar toda a carga.');
                }
            } catch (error) {
                console.error(error);
                alert('Nao foi possivel renderizar a carga.');
            } finally {
                if (renderToken === currentRenderToken) {
                    showLoading(false);
                }
            }
        }

        function resetView() {
            currentRenderToken++;
            showLoading(false);
            camera.position.set(15, 10, 15);
            camera.lookAt(0, 0, 0);

            if (cargoGroup) {
                scene.remove(cargoGroup);
                cargoGroup = null;
            }

            document.getElementById('volume-total').textContent = '0 m³';
            document.getElementById('items-count').textContent = '0';
            document.getElementById('ocupacao').textContent = '0%';
            document.getElementById('eficiencia').textContent = '0%';
            document.getElementById('info-panel').style.display = 'none';
        }

        function showLoading(show) {
            isLoading = show;
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            if (show) {
                loadingStageLabel = 'Processando carga...';
                updateLoadingProgress(0, 0);
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (scene.userData.updateCamera) {
                scene.userData.updateCamera();
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
