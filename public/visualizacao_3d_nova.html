<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização 3D - Granilha Metric</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚛 Visualização 3D de Carga</h1>
            <p id="page-subtitle">Sistema de Otimização de Carregamento</p>
        </header>

        <main>
            <section class="controls">
                <div class="control-group">
                    <label for="client-select">Selecione o Cliente:</label>
                    <select id="client-select">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="renderCargo()">
                        📦 Renderizar Carga
                    </button>
                    <button class="btn-secondary" onclick="resetView()">
                        🔄 Resetar Visualização
                    </button>
                </div>

                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-label">Ocupação</div>
                        <div class="stat-value" id="ocupacao">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Eficiência</div>
                        <div class="stat-value" id="eficiencia">0%</div>
                    </div>
                </div>
            </section>

            <section class="visualization">
                <div id="canvas-container"></div>
                <div id="loading" class="loading" style="display: none;">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Processando carga...</div>
                </div>
            </section>

            <section class="info-panel" id="info-panel" style="display: none;">
                <h3>📊 Informações do Carregamento</h3>
                <div id="info-content"></div>
            </section>
        </main>
    </div>

    <!-- Scripts modulares -->
    <script src="js/client-data.js?v=20260408-45"></script>
    <script src="js/utils.js?v=20260408-45"></script>
    <script src="js/three-scene.js?v=20260408-45"></script>
    <script src="js/cargo-logic.js?v=20260408-45"></script>
    <script src="js/main.js?v=20260408-45"></script>
</body>
</html>
